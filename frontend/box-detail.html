<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Détails Box - Simulateur IoT</title>
    
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    
    <!-- CSS personnalisé -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary fixed-top">
        <div class="container-fluid">
            <a class="navbar-brand" href="index.html">
                <i class="bi bi-cpu"></i> Simulateur IoT
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="index.html">
                            <i class="bi bi-speedometer2"></i> Dashboard
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="config3a.html">
                            <i class="bi bi-gear"></i> Config 3A
                        </a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Contenu principal -->
    <div class="container-fluid mt-4">
        <!-- Bouton retour et titre -->
        <div class="row mb-4">
            <div class="col">
                <a href="index.html" class="btn btn-outline-secondary btn-sm mb-3">
                    <i class="bi bi-arrow-left"></i> Retour au Dashboard
                </a>
                <div class="d-flex justify-content-between align-items-center">
                    <div>
                        <h2><i class="bi bi-box"></i> Box : <span id="box-id-title">-</span></h2>
                        <p class="text-muted">Détails et contrôle de la box</p>
                    </div>
                    <button class="btn btn-danger" onclick="deleteBox()">
                        <i class="bi bi-trash"></i> Supprimer
                    </button>
                </div>
            </div>
        </div>

        <!-- Alerte si box non trouvée -->
        <div id="box-not-found" class="alert alert-danger" style="display: none;">
            <i class="bi bi-exclamation-triangle"></i> Box non trouvée !
            <a href="index.html" class="alert-link">Retour au dashboard</a>
        </div>

        <div id="box-content" style="display: none;">
            <!-- Ligne 1 : Capteurs et Relais -->
            <div class="row">
                <!-- Capteurs -->
                <div class="col-lg-6 mb-4">
                    <div class="card">
                        <div class="card-header">
                            <h5 class="mb-0"><i class="bi bi-thermometer-half"></i> Capteurs</h5>
                        </div>
                        <div class="card-body" id="capteurs-container">
                            <!-- Rempli dynamiquement -->
                        </div>
                    </div>
                </div>

                <!-- Relais -->
                <div class="col-lg-6 mb-4">
                    <div class="card">
                        <div class="card-header">
                            <h5 class="mb-0"><i class="bi bi-toggle-on"></i> Relais</h5>
                        </div>
                        <div class="card-body" id="relais-container">
                            <!-- Rempli dynamiquement -->
                        </div>
                    </div>
                </div>
            </div>

            <!-- Ligne 2 : Compteurs et Simulation -->
            <div class="row">
                <!-- Compteurs -->
                <div class="col-lg-6 mb-4">
                    <div class="card">
                        <div class="card-header">
                            <h5 class="mb-0"><i class="bi bi-speedometer"></i> Compteurs</h5>
                        </div>
                        <div class="card-body" id="compteurs-container">
                            <!-- Rempli dynamiquement -->
                        </div>
                    </div>
                </div>

                <!-- Contrôle Simulation -->
                <div class="col-lg-6 mb-4">
                    <div class="card">
                        <div class="card-header">
                            <h5 class="mb-0"><i class="bi bi-play-circle"></i> Simulation</h5>
                        </div>
                        <div class="card-body">
                            <div class="mb-3">
                                <label class="form-label">Statut :</label>
                                <div>
                                    <span id="simulation-status" class="badge bg-secondary">Arrêtée</span>
                                </div>
                            </div>

                            <div class="mb-3">
                                <label for="intervalle-input" class="form-label">Intervalle (secondes) :</label>
                                <input type="number" class="form-control" id="intervalle-input" value="5" min="1" max="60">
                            </div>

                            <div class="d-grid gap-2">
                                <button class="btn btn-success" id="start-btn" onclick="startSimulation()">
                                    <i class="bi bi-play-fill"></i> Démarrer
                                </button>
                                <button class="btn btn-warning" id="stop-btn" onclick="stopSimulation()" style="display: none;">
                                    <i class="bi bi-stop-fill"></i> Arrêter
                                </button>
                            </div>
                        </div>
                    </div>

                    <!-- Historique -->
                    <div class="card mt-3">
                        <div class="card-body text-center">
                            <a href="#" onclick="goToHistory()" class="btn btn-outline-primary w-100">
                                <i class="bi bi-clock-history"></i> Voir l'historique
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Indicateur de rafraîchissement automatique -->
    <div class="auto-refresh-indicator">
        <div class="refresh-spinner"></div>
        <span>Rafraîchissement auto (3s)</span>
    </div>

    <!-- Loading overlay -->
    <div id="loading-overlay" class="loading-overlay" style="display: none;">
        <div class="loading-spinner"></div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    
    <!-- API Module -->
    <script src="js/api.js"></script>
    
    <!-- Box Detail JS -->
    <script src="js/box-detail.js"></script>
</body>
</html>
