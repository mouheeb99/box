<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Simulateur IoT</title>
    
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    
    <!-- CSS personnalisé -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary fixed-top">
        <div class="container-fluid">
            <a class="navbar-brand" href="index.html">
                <i class="bi bi-cpu"></i> Simulateur IoT
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link active" href="index.html">
                            <i class="bi bi-speedometer2"></i> Dashboard
                        </a>
                    </li>
                  
                    <li class="nav-item">
                        <a class="nav-link" href="config3a.html">
                            <i class="bi bi-gear"></i> Config 3A
                        </a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Contenu principal -->
    <div class="container-fluid mt-4">
        <!-- En-tête -->
        <div class="row mb-4">
            <div class="col">
                <h2><i class="bi bi-speedometer2"></i> Dashboard</h2>
                <p class="text-muted">Vue d'ensemble du système de simulation</p>
            </div>
        </div>

        <!-- Statistiques -->
        <div class="row mb-4" id="stats-container">
            <div class="col-md-4">
                <div class="card stat-card">
                    <div class="card-body">
                        <div class="stat-value" id="stat-total">-</div>
                        <div class="stat-label">Total Boxes</div>
                    </div>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card stat-card">
                    <div class="card-body">
                        <div class="stat-value text-success" id="stat-active">-</div>
                        <div class="stat-label">Simulations Actives</div>
                    </div>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card stat-card">
                    <div class="card-body">
                        <div class="stat-value text-secondary" id="stat-stopped">-</div>
                        <div class="stat-label">Simulations Arrêtées</div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Liste des boxes -->
        <div class="row">
            <div class="col-12">
                <div class="card">
                    <div class="card-header d-flex justify-content-between align-items-center">
                        <h5 class="mb-0"><i class="bi bi-box"></i> Liste des Boxes</h5>
                        <a href="boxes.html" class="btn btn-primary btn-sm">
                            <i class="bi bi-plus-circle"></i> Créer Box
                        </a>
                    </div>
                    <div class="card-body">
                        <!-- Alerte si aucune box -->
                        <div id="no-boxes-alert" class="alert alert-info" style="display: none;">
                            <i class="bi bi-info-circle"></i> Aucune box créée. 
                            <a href="boxes.html" class="alert-link">Créer votre première box</a>
                        </div>

                        <!-- Tableau des boxes -->
                        <div class="table-responsive">
                            <table class="table table-hover" id="boxes-table">
                                <thead>
                                    <tr>
                                        <th>ID</th>
                                        <th>Capteurs</th>
                                        <th>Relais</th>
                                        <th>Compteurs</th>
                                        <th>Simulation</th>
                                        <th>Actions</th>
                                    </tr>
                                </thead>
                                <tbody id="boxes-tbody">
                                    <!-- Rempli dynamiquement -->
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Indicateur de rafraîchissement automatique -->
    <div class="auto-refresh-indicator">
        <div class="refresh-spinner"></div>
        <span>Rafraîchissement auto (3s)</span>
    </div>

    <!-- Loading overlay -->
    <div id="loading-overlay" class="loading-overlay" style="display: none;">
        <div class="loading-spinner"></div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    
    <!-- API Module -->
    <script src="js/api.js"></script>
    
    <!-- Dashboard JS -->
    <script src="js/dashboard.js"></script>
</body>
</html>
